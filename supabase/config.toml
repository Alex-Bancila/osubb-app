# Supabase local configuration for the OSUBB app.
# If your installed CLI version rejects a key, regenerate with `npx supabase init --force`
# and re-apply the auth changes below (enable_signup = false → invite-only).

project_id = "osubb-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

# Local email testing (magic / invite links) runs by default during dev; the CLI
# prints its inbox URL on `supabase start`. (The old [inbucket] section is deprecated
# in recent CLI versions, so we rely on the default here.)

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Where a magic link sends the member back. This is the Vite dev server — a link
# that returns anywhere else lands on nothing, and the sign-in silently fails.
# The allow-list exists against open-redirect abuse, so keep it short and exact:
# GoTrue refuses any redirect_to that is not on it. Both spellings of localhost
# are here because the browser and the CLI do not always agree on which one the
# dev server is. Staging and production set the same two fields by hand in the
# dashboard, pointed at the deployed URL (#54, #109) — config.toml never travels.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# INVITE-ONLY: no public self-service sign-up. Accounts are created by BC via the
# admin invite / CSV-import flow (magic link). See docs/adr/0003-invite-only-auth.md.
enable_signup = false
enable_manual_linking = false

# Epic 2.2: inject member_role / member_level / dept_ids / team_ids into the JWT.
# Hosted projects need this enabled once in Dashboard → Authentication → Hooks.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
# The email PROVIDER must be on — magic links are the only way into the app
# (ADR-0003). Without this the CLI renders GOTRUE_EXTERNAL_EMAIL_ENABLED=false
# and every login fails with "Email logins are disabled", invites included.
# Distinct from enable_signup below, which is what keeps the app invite-only.
enabled = true
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Both sign-in emails carry the link AND `{{ .Token }}` — the same one-time
# password, the same expiry, rendered twice. The code is what makes an installed
# PWA on iOS usable at all: its storage is separate from Safari's, so a tapped
# link signs the member into Safari while the app they installed keeps showing
# the login screen. A link opened on a second device fails the same way. This is
# not a new authentication path (#599, ADR-0003).
#
# `content_path` is resolved from the directory the CLI runs in — the repository
# root — not from this file. Hosted projects never read config.toml: the same
# two bodies are pasted into Authentication → Email Templates (#54, #77).
[auth.email.template.magic_link]
subject = "Conectare la aplicația OSUBB"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "Ai fost invitat în aplicația OSUBB"
content_path = "./supabase/templates/invite.html"

# Google OAuth — fill client_id/secret from env when enabling (Epic 2.1).
[auth.external.google]
enabled = false
client_id = ""
secret = ""

# Epic 2.3b — BC invites a member (magic link + provisioning).
# verify_jwt keeps unauthenticated noise out at the gateway; the function
# still does the real authorization (level >= 6, read from the database).
[functions.invite-member]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/invite-member/index.ts"

# Epic 2.4 — BC imports up to 100 recruits from validated CSV text.
[functions.csv-import]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/csv-import/index.ts"

# #703 (ADR-0010) — Web Push outbox sender, called every minute by the
# pg_cron job osubb-send-push through pg_net. verify_jwt = false (#769, ruling
# L8): the caller is authenticated by the project's secret key (sb_secret_...)
# on the apikey header, which the handler compares in constant time. The
# secret key is not a JWT, so the gateway's JWT check would refuse it, and the
# legacy service_role JWT it used to check is retired by the end of 2026.
[functions.send-push]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/send-push/index.ts"
