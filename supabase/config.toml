# Supabase local configuration for the OSUBB app.
# If your installed CLI version rejects a key, regenerate with `npx supabase init --force`
# and re-apply the auth changes below (enable_signup = false → invite-only).

project_id = "osubb-app"

[api]
enabled = true
port = 54321
# `public` only. `graphql_public` is not exposed (security pass 2026-09-27,
# I1): nothing in the app or the functions uses GraphQL, and exposing it gives
# schema introspection to anyone holding the anon key. Hosted projects mirror
# this by hand (docs/backend/auth-config.md, "Hosted projects").
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# At most 500 rows per response. Every list the app pages reads 500 at a time
# (the Work Filter lists, Clasament, the directory, the history), so this is
# exactly one page; a request for more gets a short page, never a huge one.
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

# Local email testing (magic / invite links) runs by default during dev; the CLI
# prints its inbox URL on `supabase start`. (The old [inbucket] section is deprecated
# in recent CLI versions, so we rely on the default here.)

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Where a magic link sends the member back. This is the Vite dev server — a link
# that returns anywhere else lands on nothing, and the sign-in silently fails.
# The allow-list exists against open-redirect abuse, so keep it short and exact:
# GoTrue refuses any redirect_to that is not on it. Both spellings of localhost
# are here because the browser and the CLI do not always agree on which one the
# dev server is. Staging and production set the same two fields by hand in the
# dashboard, pointed at the deployed URL (#54, #109) — config.toml never travels.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/confirm",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# INVITE-ONLY: no public self-service sign-up. Accounts are created by BC via the
# admin invite / CSV-import flow (magic link). See docs/adr/0003-invite-only-auth.md.
enable_signup = false
enable_manual_linking = false

# Auth rate limits (security pass 2026-09-27, I1), pinned rather than left to
# the CLI's defaults so the hosted dashboard has one place to be checked
# against (docs/backend/auth-config.md, "Rate limits"). Sized for ~20 Members
# at launch, many of them behind one university or event NAT: a whole room
# signing in at once must fit under the per-IP limits, a script trying
# addresses or codes must not.
[auth.rate_limit]
# Emails per hour, project-wide. Only applies with custom SMTP, so locally
# (Mailpit) it has no effect; on the hosted projects it matches the Resend
# plan (launch runbook §5 step 6; raised to 250 on CSV-import days only).
email_sent = 100
# Sign-in (magic link / code) requests per IP per 5 minutes.
sign_in_sign_ups = 30
# Link or six-digit code verifications per IP per 5 minutes. With six-digit
# codes this is the brute-force bound: 30 guesses per IP per 5 minutes, each
# code dying on use or at its expiry.
token_verifications = 30
# Token refreshes per IP per 5 minutes; the app refreshes on focus once a
# token is ~15 minutes old (ADR-0003), well under this for a room of 30.
token_refresh = 150

# Epic 2.2: inject member_role / member_level / group_ids into the JWT (#591 dropped dept_ids / team_ids).
# Hosted projects need this enabled once in Dashboard → Authentication → Hooks.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
# The email PROVIDER must be on — magic links are the only way into the app
# (ADR-0003). Without this the CLI renders GOTRUE_EXTERNAL_EMAIL_ENABLED=false
# and every login fails with "Email logins are disabled", invites included.
# Distinct from enable_signup below, which is what keeps the app invite-only.
enabled = true
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# All three emails carry the link AND `{{ .Token }}` — the same one-time
# password, the same expiry, rendered twice. The code is what makes an installed
# PWA on iOS usable at all: its storage is separate from Safari's, so a tapped
# link signs the member into Safari while the app they installed keeps showing
# the login screen. A link opened on a second device fails the same way. This is
# not a new authentication path (#599, ADR-0003).
#
# The link goes to the app's `/auth/confirm?token_hash=…`, not to
# `{{ .ConfirmationURL }}`: Supabase's verify endpoint spends the token on the
# first GET, and Microsoft 365 link scanning makes that GET on delivery. The
# page spends it only when the Member taps (ruling L7, #768).
# `scripts/check-auth-templates.sh` keeps all three templates on that shape.
#
# `content_path` is resolved from the directory the CLI runs in — the repository
# root — not from this file. Hosted projects never read config.toml: the same
# three bodies are pasted into Authentication → Email Templates (#54, #77).
[auth.email.template.magic_link]
subject = "Conectare la aplicația OSUBB"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "Ai fost invitat în aplicația OSUBB"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirmă schimbarea adresei de email"
content_path = "./supabase/templates/email-change.html"

# Google OAuth — fill client_id/secret from env when enabling (Epic 2.1).
[auth.external.google]
enabled = false
client_id = ""
secret = ""

# Epic 2.3b — BC invites a member (magic link + provisioning).
# verify_jwt keeps unauthenticated noise out at the gateway; the function
# still does the real authorization (level >= 6, read from the database).
[functions.invite-member]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/invite-member/index.ts"

# Epic 2.4 — BC imports up to 100 recruits from validated CSV text. #991: the
# volunteer sheet (recognised by its header) is a dry-run, then an apply that
# creates accounts without sending any email.
[functions.csv-import]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/csv-import/index.ts"

# #773 (ruling L19) — BC/Moderator correct the address of a Member who never
# signed in and re-send the invitation. Same gate as invite-member: the
# gateway checks the JWT, the function checks level >= 6 in the database.
[functions.reinvite-member]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/reinvite-member/index.ts"

# #991 — BC/Moderator send the invitations of never-invited Members (the
# volunteer import) in batches of at most 50; the batch stops cleanly on
# Auth's over_email_send_rate_limit. Same gate as reinvite-member.
[functions.send-invitations]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/send-invitations/index.ts"

# #968 — an invited Member re-sends their own invitation from the login page.
# verify_jwt = false: the caller has not signed in, so there is no session,
# and the publishable key the app sends is not a JWT. The gates are the
# browser origin (ALLOWED_ORIGINS, _shared/cors.ts: no Origin or a foreign
# one is 403) and the database throttle public.request_invitation_allowed
# (one request per address per minute, five per address per day, twenty per
# IP per hour). The function only re-sends an existing, unconfirmed
# invitation; it never creates an account. docs/backend/inviting.md.
[functions.request-invitation]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/request-invitation/index.ts"

# #703 (ADR-0010) — Web Push outbox sender, called every minute by the
# pg_cron job osubb-send-push through pg_net. verify_jwt = false (#769, ruling
# L8): the caller is authenticated by the project's secret key (sb_secret_...)
# on the apikey header, which the handler compares in constant time. The
# secret key is not a JWT, so the gateway's JWT check would refuse it, and the
# legacy service_role JWT it used to check is retired by the end of 2026.
[functions.send-push]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/send-push/index.ts"

# #776 (ruling L20) — Resend's bounce/complaint/suppression webhook, turned
# into a system Notification for BC and the Moderator. verify_jwt = false:
# Resend sends no Supabase JWT, it signs each request the Svix way instead
# (svix-id / svix-timestamp / svix-signature), and the handler verifies that
# HMAC in constant time against the function secret RESEND_WEBHOOK_SECRET,
# refusing anything unsigned, forged or older than five minutes with 401
# before it parses the body (and a body over 64 KB with 413 before that).
# docs/backend/email.md.
[functions.resend-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/resend-webhook/index.ts"

# #775 (ruling L20) — the Email Digest sender, called by the hourly pg_cron
# job osubb-email-digest through pg_net. verify_jwt = false, exactly like
# send-push: the caller is authenticated by the project's secret key on the
# apikey header, compared in constant time in the handler. It sends through
# the Resend API with the function secret RESEND_API_KEY.
# docs/backend/email.md.
[functions.send-digest]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/send-digest/index.ts"
