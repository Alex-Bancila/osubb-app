<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: the shell pads with env(safe-area-inset-*) around phone notches.
         interactive-widget=resizes-content: Android Chrome shrinks the layout
         to the area above the on-screen keyboard (#1013); iOS ignores it, and
         lib/keyboard-inset.ts measures the keyboard there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Aplicația internă OSUBB — taskuri, puncte, calendar, anunțuri."
    />
    <meta name="theme-color" content="#ED2025" />
    <title>OSUBB</title>

    <!-- Theme before first paint. A blocking classic script from public/, not
         inline: the Content-Security-Policy allows script-src 'self' only (#770). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
