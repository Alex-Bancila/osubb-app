<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- viewport-fit=cover: Ionic needs it to respect phone safe areas (notches). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Aplicația internă OSUBB — taskuri, puncte, calendar, anunțuri."
    />
    <title>OSUBB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />

    <script>
      /* Apply the theme before first paint, so dark-mode users never see a white
         flash. The toggle that writes this key arrives with the profile screen
         (#108); until then we follow the OS. Same storage key as the mockup. */
      (function () {
        try {
          var saved = localStorage.getItem('osubb-theme');
          var dark = saved
            ? saved === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* private mode, storage disabled — light theme is a fine fallback */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
