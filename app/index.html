<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- viewport-fit=cover: Ionic needs it to respect phone safe areas (notches). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Aplicația internă OSUBB — taskuri, puncte, calendar, anunțuri."
    />
    <meta name="theme-color" content="#ED2025" />
    <title>OSUBB</title>

    <!-- Theme before first paint. A blocking classic script from public/, not
         inline: the Content-Security-Policy allows script-src 'self' only (#770). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
