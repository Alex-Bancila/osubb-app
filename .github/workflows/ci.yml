name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SUPABASE_CLI_VERSION: 2.117.0
  # The deploy jobs' Wrangler, pinned so a Cloudflare release never changes a
  # deploy between two merges (wrangler-action would install `latest`).
  WRANGLER_VERSION: 4.139.0

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      - name: Check repository
        run: npm run check:root

  db:
    name: Migrations + db tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: CLI pin matches root package.json
        run: |
          pinned="$(node -p "require('./package.json').devDependencies.supabase")"
          test "$pinned" = "$SUPABASE_CLI_VERSION" || { echo "::error::root package.json pins supabase $pinned but CI uses $SUPABASE_CLI_VERSION"; exit 1; }

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # setup-cli forces GHCR; clear its override so the CLI can fall back
      # through public ECR, GHCR, and Docker Hub if a registry is throttled.
      - name: Enable Supabase image registry fallback
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=' >> "$GITHUB_ENV"

      # Starts the local stack and applies every migration in supabase/migrations/
      - name: Start local Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector

      # The CLI already lints every user schema by default (it prints
      # "Linting schema: private / public" with no --schema flag) — pinning
      # the list here would silently skip a future third schema. --fail-on
      # defaults to none, so without it this step could never fail; the
      # baseline is clean at warning level. `db lint` only understands
      # plpgsql: trigger functions and SQL-language functions are not linted.
      - name: Lint database
        run: supabase db lint --level warning --fail-on warning

      # The private schema holds security-definer helpers and command
      # implementations that PostgREST must never expose. Hosted projects
      # don't read supabase/config.toml for exposed schemas — that's a
      # dashboard setting no workflow here pushes (see the staging-auth
      # checklist, issue #54) — so this step only guards the local/CI stack,
      # which does read config.toml on `supabase start`.
      - name: private schema stays out of the Data API
        run: |
          if grep -nE '^\s*schemas\s*=.*\bprivate\b' supabase/config.toml; then
            echo "::error::supabase/config.toml exposes the private schema through PostgREST"
            exit 1
          fi

      - name: Run pgTAP tests (if any)
        run: |
          if [ -d supabase/tests ] && ls supabase/tests/*.sql >/dev/null 2>&1; then
            supabase test db
          else
            echo "No db tests yet — skipping (Epic 6 adds them)."
          fi

      - name: Test historical data migrations
        shell: bash
        run: |
          set -euo pipefail
          for harness in supabase/tests/*_upgrade.test.sh; do
            bash "$harness"
          done

      # `supabase start` already applied seed.sql to an empty database. Staging
      # gets the same file applied to a LIVE one — see docs/backend/seeding-staging.md
      # and scripts/check-seed-rerunnable.sh for what this proves and why.
      - name: seed.sql is re-runnable
        run: bash scripts/check-seed-rerunnable.sh

      # The frontend's database.types.ts is generated from this schema and
      # committed. Regenerate it here and compare: a migration that renames a
      # column then fails the PR that ships it, instead of failing the demo
      # three screens away. This is the only job with a live database, which is
      # why the check lives here rather than beside the other frontend gates.
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts app/src/lib/database.types.ts >/dev/null; then
            echo "::error::app/src/lib/database.types.ts is stale. Run 'npm run gen:types' in app/ and commit the result."
            diff -u app/src/lib/database.types.ts /tmp/database.types.ts | head -60
            exit 1
          fi
          echo "Generated types are current."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's own commits via the GitHub API to scan
    # just that range (GET /pulls/:number/commits) even with comments off, so
    # it needs pull-requests: read on top of the workflow's default
    # contents: read — verified by a 403 "Resource not accessible by
    # integration" without it. Still no pull-requests: write: comments stay
    # disabled below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # no pull-requests: write granted

  functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Runs on every PR rather than behind a path filter: the job takes well
      # under a minute and runs beside the database job, and a filter that
      # silently skips is worse than a fast job that always speaks.
      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Type-check
        run: deno check --config supabase/functions/deno.json supabase/functions/**/*.ts

      - name: Test
        run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # app/.nvmrc pins the version the app is developed on. `cache: npm` keyed
      # on the lockfile makes `npm ci` a ~10s restore on every run after the
      # first. node-version-file is workspace-relative even though this job's
      # working-directory is app.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted — which is the check we want.
      - name: Install
        run: npm ci

      # Same five gates the app README tells you to run before pushing, in the
      # order that fails fastest. Deliberately NOT behind a `paths: app/**`
      # filter, for the reason already written on the Edge Function job above: a
      # check that silently skips is worse than a fast job that always speaks —
      # and a skipped job is indistinguishable from a passing one at a glance.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Critical module coverage
        run: npm run test:coverage

      - name: Local Montserrat wiring
        run: |
          ! grep -Eq 'fonts\.(googleapis|gstatic)\.com' index.html
          test "$(node -p "require('./package.json').dependencies['@fontsource-variable/montserrat']")" = "5.3.0"
          grep -Fq "import '@fontsource-variable/montserrat'" src/main.tsx
          grep -Fq -- '--font-family-base: "Montserrat Variable"' src/theme/tokens.css

      - name: Build
        # Exercise the live SDK bundle path; missing VITE vars let Rollup
        # tree-shake Supabase transport after the config guard throws.
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: build-placeholder
        run: npm run build

  push-staging:
    name: Push migrations to staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: db
    runs-on: ubuntu-latest
    # The staging Environment scopes the Supabase secrets to `main` (#110,
    # ruling L11). An Environment that lacks a secret of some name falls back
    # to the repository secret of that name, so this job keeps working before,
    # during and after the four secrets move from repository to Environment.
    environment: staging
    # Staging has one database, so it gets one deploy at a time. Merging a
    # batch of PRs used to start a push per merge; they raced, and two failed
    # on work a neighbour had already applied. Queued runs are superseded by
    # the newest commit, which is what we want: the last one carries every
    # pending migration anyway.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    # The deploys after this one run only when it really pushed: a web app
    # must never go live on top of migrations that were skipped.
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # No-ops politely until the staging secrets exist (issue 7.1 / 0.3).
      - name: db push
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # A variable of the staging Environment after the move (#110); the
          # repository secret until then.
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice title=Migrations not pushed::The staging Supabase secrets are not configured — skipping."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --include-all: with several PRs open at once, branches carry
          # migration timestamps that can land out of order. Without this flag
          # `db push` refuses any migration older than the newest one already
          # applied remotely, and staging silently stops tracking main.
          supabase db push --include-all
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # ── Deploys (#110, rulings L3, L11, L12) ─────────────────────────────────
  #
  # Staging on every merge to main, in this order: migrations (push-staging)
  # → Edge Functions → web app. Every pull request from a branch of this
  # repository gets a preview of the web app at pr-<n>.osubb-staging.pages.dev,
  # built against staging. Both Pages projects are Direct Upload: GitHub
  # Actions is the only thing that ever deploys them (ruling L3).
  #
  # Every deploy job first asks whether its target is configured and, when it
  # is not, says so in a notice and finishes green without deploying — the
  # same polite no-op push-staging has always made; each staging deploy also
  # stands down when the one before it did not deploy, so a web app never
  # goes live over skipped migrations or functions. So this file can merge
  # before the Cloudflare account, the Pages projects and the Environments
  # exist (#109), and the deploys light up by themselves once they do. The
  # check is a step of each deploy job rather than a job of its own: a job
  # outside an Environment cannot read that Environment's secrets, so a
  # separate gate job would report "not configured" forever.

  deploy-functions-staging:
    name: Deploy Edge Functions to staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [push-staging, functions]
    runs-on: ubuntu-latest
    environment: staging
    # One deploy of the functions at a time; a newer merge queues behind the
    # running one and supersedes any older queued one.
    concurrency:
      group: staging-functions
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Every function under supabase/functions/ (the CLI skips `_shared`),
      # each with the verify_jwt setting config.toml gives it. --use-api
      # bundles on Supabase's side, so no edge-runtime image is pulled. No
      # --prune: a function that exists only on staging is removed by a
      # person, never by a merge.
      - name: supabase functions deploy
        id: deploy
        env:
          PUSHED: ${{ needs.push-staging.outputs.pushed }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
        run: |
          # push-staging skips on the same secrets this step needs, so its
          # result is the one check: no migrations, no functions.
          if [ "$PUSHED" != true ]; then
            echo "::notice title=Edge Functions not deployed::The migrations were not pushed, so the functions are not deployed either."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  deploy-web-staging:
    name: Deploy web app to staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy-functions-staging, frontend]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://osubb-staging.pages.dev
    concurrency:
      group: staging-web
      cancel-in-progress: false
    steps:
      - name: Is Cloudflare configured?
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_DEPLOYED: ${{ needs.deploy-functions-staging.outputs.deployed }}
        run: |
          if [ "$BACKEND_DEPLOYED" != true ]; then
            echo "::notice title=Web app not deployed::The migrations and Edge Functions were not deployed, so the web app is not either."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" = true ] && [ -n "$ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Web app not deployed::CLOUDFLARE_API_TOKEN (staging Environment) or the CLOUDFLARE_ACCOUNT_ID repository variable is not set yet — skipping (#109, #110)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build with the staging variables
        if: steps.gate.outputs.ok == 'true'
        uses: ./.github/actions/build-web
        with:
          supabase-url: ${{ vars.VITE_SUPABASE_URL }}
          supabase-key: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          vapid-public-key: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          project-ref: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}

      - name: wrangler pages deploy
        if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: app
          command: pages deploy dist --project-name=osubb-staging --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

  deploy-web-preview:
    name: Deploy web preview
    # Same-repository branches only: a fork's run gets no secrets, and a
    # preview built from a fork must never hold our Cloudflare token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    permissions:
      contents: read
      pull-requests: write # the preview-URL comment
    steps:
      - name: Is Cloudflare configured?
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ -n "$ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Preview not deployed::CLOUDFLARE_API_TOKEN (preview Environment) or the CLOUDFLARE_ACCOUNT_ID repository variable is not set yet — skipping (#109, #110)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Staging's values: a preview is this PR's web app talking to staging's
      # database and functions. They are public build values, set as
      # variables on the preview Environment as well as on staging, because a
      # job reads only its own Environment's variables. SUPABASE_PROJECT_REF
      # there as well lets the build check the URL's host; without it (and
      # once the repository secret is gone) that one check is skipped.
      - name: Build with the staging variables
        if: steps.gate.outputs.ok == 'true'
        uses: ./.github/actions/build-web
        with:
          supabase-url: ${{ vars.VITE_SUPABASE_URL }}
          supabase-key: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          vapid-public-key: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          project-ref: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}

      - name: wrangler pages deploy
        id: deploy
        if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: app
          command: pages deploy dist --project-name=osubb-staging --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-dirty=true

      # One comment per PR, edited in place on every push; found by the
      # hidden marker it starts with.
      - name: Comment the preview URL
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          marker='<!-- osubb-web-preview -->'
          url="${ALIAS_URL:-https://pr-$PR.osubb-staging.pages.dev}"
          body="$(cat <<MD
          $marker
          **Web preview:** $url — talks to **staging** (its database, functions and demo data).

          - This commit (${SHA:0:7}): ${DEPLOYMENT_URL:-$url}
          - Sign in with the **six-digit code** from the email; the link in the email opens staging, not this preview.
          - Inviting members does not work here: staging's \`ALLOWED_ORIGINS\` is an exact match.
          MD
          )"
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
