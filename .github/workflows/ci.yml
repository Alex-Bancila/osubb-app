name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SUPABASE_CLI_VERSION: 2.117.0

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      - name: Check repository
        run: npm run check:root

  db:
    name: Migrations + db tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: CLI pin matches root package.json
        run: |
          pinned="$(node -p "require('./package.json').devDependencies.supabase")"
          test "$pinned" = "$SUPABASE_CLI_VERSION" || { echo "::error::root package.json pins supabase $pinned but CI uses $SUPABASE_CLI_VERSION"; exit 1; }

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Starts the local stack and applies every migration in supabase/migrations/
      - name: Start local Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector

      # The CLI already lints every user schema by default (it prints
      # "Linting schema: private / public" with no --schema flag) — pinning
      # the list here would silently skip a future third schema. --fail-on
      # defaults to none, so without it this step could never fail; the
      # baseline is clean at warning level. `db lint` only understands
      # plpgsql: trigger functions and SQL-language functions are not linted.
      - name: Lint database
        run: supabase db lint --level warning --fail-on warning

      # The private schema holds security-definer helpers and command
      # implementations that PostgREST must never expose. Hosted projects
      # don't read supabase/config.toml for exposed schemas — that's a
      # dashboard setting no workflow here pushes (see the staging-auth
      # checklist, issue #54) — so this step only guards the local/CI stack,
      # which does read config.toml on `supabase start`.
      - name: private schema stays out of the Data API
        run: |
          if grep -nE '^\s*schemas\s*=.*\bprivate\b' supabase/config.toml; then
            echo "::error::supabase/config.toml exposes the private schema through PostgREST"
            exit 1
          fi

      - name: Run pgTAP tests (if any)
        run: |
          if [ -d supabase/tests ] && ls supabase/tests/*.sql >/dev/null 2>&1; then
            supabase test db
          else
            echo "No db tests yet — skipping (Epic 6 adds them)."
          fi

      - name: Test historical data migrations
        shell: bash
        run: |
          set -euo pipefail
          for harness in supabase/tests/*_upgrade.test.sh; do
            bash "$harness"
          done

      # `supabase start` already applied seed.sql to an empty database. Staging
      # gets the same file applied to a LIVE one — see docs/backend/seeding-staging.md
      # and scripts/check-seed-rerunnable.sh for what this proves and why.
      - name: seed.sql is re-runnable
        run: bash scripts/check-seed-rerunnable.sh

      # The frontend's database.types.ts is generated from this schema and
      # committed. Regenerate it here and compare: a migration that renames a
      # column then fails the PR that ships it, instead of failing the demo
      # three screens away. This is the only job with a live database, which is
      # why the check lives here rather than beside the other frontend gates.
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts app/src/lib/database.types.ts >/dev/null; then
            echo "::error::app/src/lib/database.types.ts is stale. Run 'npm run gen:types' in app/ and commit the result."
            diff -u app/src/lib/database.types.ts /tmp/database.types.ts | head -60
            exit 1
          fi
          echo "Generated types are current."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's own commits via the GitHub API to scan
    # just that range (GET /pulls/:number/commits) even with comments off, so
    # it needs pull-requests: read on top of the workflow's default
    # contents: read — verified by a 403 "Resource not accessible by
    # integration" without it. Still no pull-requests: write: comments stay
    # disabled below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # no pull-requests: write granted

  functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Runs on every PR rather than behind a path filter: the job takes well
      # under a minute and runs beside the database job, and a filter that
      # silently skips is worse than a fast job that always speaks.
      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Type-check
        run: deno check --config supabase/functions/deno.json supabase/functions/**/*.ts

      - name: Test
        run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # app/.nvmrc pins the version the app is developed on. `cache: npm` keyed
      # on the lockfile makes `npm ci` a ~10s restore on every run after the
      # first. node-version-file is workspace-relative even though this job's
      # working-directory is app.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted — which is the check we want.
      - name: Install
        run: npm ci

      # Same five gates the app README tells you to run before pushing, in the
      # order that fails fastest. Deliberately NOT behind a `paths: app/**`
      # filter, for the reason already written on the Edge Function job above: a
      # check that silently skips is worse than a fast job that always speaks —
      # and a skipped job is indistinguishable from a passing one at a glance.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Critical module coverage
        run: npm run test:coverage

      - name: Local Montserrat wiring
        run: |
          ! grep -Eq 'fonts\.(googleapis|gstatic)\.com' index.html
          test "$(node -p "require('./package.json').dependencies['@fontsource-variable/montserrat']")" = "5.3.0"
          grep -Fq "import '@fontsource-variable/montserrat'" src/main.tsx
          grep -Fq -- '--font-family-base: "Montserrat Variable"' src/theme/tokens.css

      - name: Build
        run: npm run build

  push-staging:
    name: Push migrations to staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: db
    runs-on: ubuntu-latest
    # Staging has one database, so it gets one deploy at a time. Merging a
    # batch of PRs used to start a push per merge; they raced, and two failed
    # on work a neighbour had already applied. Queued runs are superseded by
    # the newest commit, which is what we want: the last one carries every
    # pending migration anyway.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # No-ops politely until the staging secrets exist (issue 7.1 / 0.3).
      - name: db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Staging secrets not configured yet — skipping (see issue 7.1)."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --include-all: with several PRs open at once, branches carry
          # migration timestamps that can land out of order. Without this flag
          # `db push` refuses any migration older than the newest one already
          # applied remotely, and staging silently stops tracking main.
          supabase db push --include-all
