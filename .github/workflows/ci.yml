name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db:
    name: Migrations + db tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the local stack and applies every migration in supabase/migrations/
      - name: Start local Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector

      - name: Lint database
        run: supabase db lint

      - name: Run pgTAP tests (if any)
        run: |
          if [ -d supabase/tests ] && ls supabase/tests/*.sql >/dev/null 2>&1; then
            supabase test db
          else
            echo "No db tests yet — skipping (Epic 6 adds them)."
          fi

      # `supabase start` already applied seed.sql to an empty database. Staging
      # gets the same file applied to a LIVE one (docs/backend/seeding-staging.md),
      # so it has to be re-runnable: applying it twice must leave the same demo
      # data, not a duplicate of it and not an error. Compare a content
      # fingerprint — row ids advance with the sequences and are not part of it.
      - name: seed.sql is re-runnable
        run: |
          cat > fingerprint.sql <<'SQL'
          select md5(string_agg(x, '|' order by x))
            from (
              select format('member:%s:%s:%s', full_name, role, status) from profiles
              union all select format('points:%s:%s:%s', full_name, points, rank) from leaderboard
              union all select format('dept:%s:%s', member_id, dept_id) from member_departments
              union all select format('team:%s:%s:%s', id, name, for_recruits) from teams
              union all select format('task:%s:%s:%s', title, status, coalesce(rating::text, '-')) from tasks
              union all select format('assignee:%s:%s', t.title, p.full_name)
                          from task_assignees a
                          join tasks t on t.id = a.task_id
                          join profiles p on p.id = a.member_id
              union all select format('ledger:%s:%s:%s', p.full_name, l.delta, l.reason)
                          from points_ledger l join profiles p on p.id = l.member_id
              union all select format('event:%s:%s', title, scope) from events
              union all select format('rsvp:%s:%s:%s', e.title, p.full_name, a.status)
                          from event_attendance a
                          join events e on e.id = a.event_id
                          join profiles p on p.id = a.member_id
              union all select format('announce:%s:%s:%s', title, priority, pinned) from announcements
              union all select format('notif:%s:%s:%s', p.full_name, n.kind, n.title)
                          from notifications n join profiles p on p.id = n.member_id
            ) s (x);
          SQL

          db() { docker exec -i supabase_db_osubb-app psql -U postgres -d postgres "$@"; }

          before=$(db -tA < fingerprint.sql)
          db -q -v ON_ERROR_STOP=1 --single-transaction < supabase/seed.sql
          after=$(db -tA < fingerprint.sql)

          if [ "$before" != "$after" ]; then
            echo "::error::Applying supabase/seed.sql twice changed the data ($before -> $after). Staging applies this file to a live database; it must be safe to run again."
            exit 1
          fi
          echo "seed.sql applied twice, same data: $before"

      # The frontend's database.types.ts is generated from this schema and
      # committed. Regenerate it here and compare: a migration that renames a
      # column then fails the PR that ships it, instead of failing the demo
      # three screens away. This is the only job with a live database, which is
      # why the check lives here rather than beside the other frontend gates.
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts app/src/lib/database.types.ts >/dev/null; then
            echo "::error::app/src/lib/database.types.ts is stale. Run 'npm run gen:types' in app/ and commit the result."
            diff -u app/src/lib/database.types.ts /tmp/database.types.ts | head -60
            exit 1
          fi
          echo "Generated types are current."

  functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Runs on every PR rather than behind a path filter: the job takes well
      # under a minute and runs beside the database job, and a filter that
      # silently skips is worse than a fast job that always speaks.
      - name: Type-check
        run: deno check --config supabase/functions/invite-member/deno.json supabase/functions/**/*.ts

      - name: Test
        run: deno test --allow-env --config supabase/functions/invite-member/deno.json supabase/functions/

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # 24 matches the version the app is developed on. `cache: npm` keyed on the
      # lockfile makes `npm ci` a ~10s restore on every run after the first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted — which is the check we want.
      - name: Install
        run: npm ci

      # Same five gates the app README tells you to run before pushing, in the
      # order that fails fastest. Deliberately NOT behind a `paths: app/**`
      # filter, for the reason already written on the Edge Function job above: a
      # check that silently skips is worse than a fast job that always speaks —
      # and a skipped job is indistinguishable from a passing one at a glance.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  push-staging:
    name: Push migrations to staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: db
    runs-on: ubuntu-latest
    # Staging has one database, so it gets one deploy at a time. Merging a
    # batch of PRs used to start a push per merge; they raced, and two failed
    # on work a neighbour had already applied. Queued runs are superseded by
    # the newest commit, which is what we want: the last one carries every
    # pending migration anyway.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # No-ops politely until the staging secrets exist (issue 7.1 / 0.3).
      - name: db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Staging secrets not configured yet — skipping (see issue 7.1)."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --include-all: with several PRs open at once, branches carry
          # migration timestamps that can land out of order. Without this flag
          # `db push` refuses any migration older than the newest one already
          # applied remotely, and staging silently stops tracking main.
          supabase db push --include-all
