name: Uptime check

# External watch for https://app.osubb.ro and staging (#777, ruling L20 of
# the 2026-09-25 launch grill — deferred to after launch). No new vendor: a
# scheduled Actions run does the GET + header checks issue #777 asked for
# and opens a GitHub issue on failure, closing it again with a comment on
# the next green run.
#
# Targets come from repository variables, never hard-coded, because the
# staging Pages project (#109) and the custom domain do not exist at every
# point in time this workflow runs:
#   UPTIME_URLS            required to check anything: comma-separated
#                          origins to check on "/", e.g.
#                          https://app.osubb.ro,https://osubb-staging.pages.dev
#   UPTIME_SUPABASE_URLS   optional: comma-separated Supabase project URLs
#                          (no path) to check on /rest/v1/
#   UPTIME_SUPABASE_KEY    optional: sent as the apikey header for the check
#                          above. Any string works for this purpose — an
#                          unrecognised key still answers 401 (a pass here),
#                          while a paused project answers 5xx (a failure).
#
# When UPTIME_URLS is unset or empty the job exits 0 without checking
# anything: the staging URL does not exist yet (#109 is Alex's), and nothing
# may alert before then.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time; a scheduled run still checking when the next one fires
# queues rather than overlapping it or racing it to update the same issue.
concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  check:
    name: Check external uptime
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout: nothing here reads a repository file, and
      # GH_REPO below tells gh which repository to talk to without one.
      - name: Check targets and report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPTIME_URLS: ${{ vars.UPTIME_URLS }}
          UPTIME_SUPABASE_URLS: ${{ vars.UPTIME_SUPABASE_URLS }}
          UPTIME_SUPABASE_KEY: ${{ vars.UPTIME_SUPABASE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -z "${UPTIME_URLS// /}" ]; then
            echo "::notice title=Uptime check skipped::UPTIME_URLS is not set — nothing to check yet (#109)."
            exit 0
          fi

          label_ensured=0
          ensure_label() {
            [ "$label_ensured" = 1 ] && return 0
            gh label create uptime --color B60205 \
              --description "External uptime check failing (#777)" --force >/dev/null
            label_ensured=1
          }

          now() { date -u +'%Y-%m-%dT%H:%M:%SZ'; }

          # One attempt against a web origin: 200 on /, a CSP header, and the
          # manifest served with the right content type — the same three
          # things release-production.yml checks after a deploy.
          check_web() {
            local host="$1" headers status problems=""
            # GET, not HEAD: some static hosts answer a HEAD differently
            # (or not at all) from the GET a real visitor sends. -D - dumps
            # the headers to stdout; -o /dev/null discards the body.
            headers="$(curl -sS -D - -o /dev/null --connect-timeout 5 --max-time 10 "$host/" 2>&1)"
            status="$(printf '%s\n' "$headers" | head -1 | grep -oE '[0-9]{3}' | head -1)"
            if [ "$status" != 200 ]; then
              problems="$problems- GET $host/ -> ${status:-no response}\n"
            fi
            if ! printf '%s\n' "$headers" | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
                | grep -Eq '^content-security-policy(-report-only)?:'; then
              problems="$problems- $host/ sent no Content-Security-Policy header\n"
            fi
            local manifest_out manifest_status manifest_type
            manifest_out="$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null \
              -w '%{http_code}|%{content_type}' "$host/manifest.webmanifest" 2>&1)"
            manifest_status="${manifest_out%%|*}"
            manifest_type="${manifest_out#*|}"
            if [ "$manifest_status" != 200 ] || [ "${manifest_type%%;*}" != application/manifest+json ]; then
              problems="$problems- $host/manifest.webmanifest is '${manifest_status:-no response} ${manifest_type}', expected 200 application/manifest+json\n"
            fi
            if [ -z "$problems" ]; then
              DETAIL=""
              return 0
            fi
            DETAIL="$(printf '%b\ncurl -sSD - -o /dev/null %s/:\n%s\n' "$problems" "$host" "$headers")"
            return 1
          }

          # One attempt against a Supabase REST root: 200 or 401 both prove
          # the project answers; a paused project answers 5xx instead.
          check_supabase() {
            local url="$1" status
            status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 \
              -H "apikey: ${UPTIME_SUPABASE_KEY:-}" "${url%/}/rest/v1/" 2>&1)"
            if [ "$status" = 200 ] || [ "$status" = 401 ]; then
              DETAIL=""
              return 0
            fi
            DETAIL="$(printf 'GET %s/rest/v1/ -> %s, expected 200 or 401\n' "${url%/}" "${status:-no response}")"
            return 1
          }

          # The open "uptime" issue for this target, if any. The title
          # carries the target so a later run finds it again; the timestamp
          # after "since" stays whatever it was when the issue was created.
          find_issue() {
            gh issue list --label uptime --state open --json number,title --limit 200 \
              | jq -r --arg t "$1" '.[] | select(.title | startswith("Uptime: " + $t + " failing")) | .number' \
              | head -1
          }

          # $overall is the caller's exit code: a target that is failing
          # already sets it, and here a gh call that itself fails (a flaky
          # API, a permission slip) sets it too — never let a target look
          # recovered, or the run exit 0, just because updating its issue
          # silently failed.
          report() {
            local target="$1" ok="$2" number
            number="$(find_issue "$target")"
            if [ "$ok" = 1 ]; then
              if [ -n "$number" ]; then
                if gh issue comment "$number" --body "Green again at $(now) UTC — closing. [Run]($RUN_URL)" \
                    && gh issue close "$number"; then
                  echo "recovered: $target (#$number)"
                else
                  echo "::error::$target recovered, but updating issue #$number failed"
                  overall=1
                fi
              fi
            else
              echo "::error::$target failing"
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$(printf 'Still failing at %s UTC:\n\n```\n%s\n```\n\n[Run](%s)' "$(now)" "$DETAIL" "$RUN_URL")" \
                  || { echo "::error::could not comment on issue #$number for $target"; overall=1; }
              else
                ensure_label
                gh issue create --label uptime \
                  --title "Uptime: $target failing since $(now)" \
                  --body "$(printf '```\n%s\n```\n\n[Run](%s)' "$DETAIL" "$RUN_URL")" \
                  || { echo "::error::could not create an issue for $target"; overall=1; }
              fi
            fi
          }

          overall=0

          IFS=',' read -ra hosts <<< "$UPTIME_URLS"
          for raw in "${hosts[@]}"; do
            host="$(echo "$raw" | xargs)"
            [ -z "$host" ] && continue
            ok=1
            for attempt in 1 2 3; do
              if check_web "$host"; then ok=1; break; else ok=0; fi
              [ "$attempt" -lt 3 ] && sleep 20
            done
            [ "$ok" = 1 ] && echo "ok: $host" || overall=1
            report "$host" "$ok"
          done

          if [ -n "${UPTIME_SUPABASE_URLS// /}" ]; then
            IFS=',' read -ra supaurls <<< "$UPTIME_SUPABASE_URLS"
            for raw in "${supaurls[@]}"; do
              url="$(echo "$raw" | xargs)"
              [ -z "$url" ] && continue
              ok=1
              for attempt in 1 2 3; do
                if check_supabase "$url"; then ok=1; break; else ok=0; fi
                [ "$attempt" -lt 3 ] && sleep 20
              done
              target="${url%/}/rest/v1/"
              [ "$ok" = 1 ] && echo "ok: $target" || overall=1
              report "$target" "$ok"
            done
          fi

          exit "$overall"
