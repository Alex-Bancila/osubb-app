name: Seed staging demo data

# Manual on purpose.
#
# Migrations deploy themselves on every merge to main (ci.yml). Demo data does
# not, and cannot: `supabase db push` applies migrations only, so seed.sql has
# never once reached a hosted project. Staging therefore had the entire schema
# and zero rows — screens that render perfectly and show nothing (issue #139).
#
# This workflow closes that gap by applying supabase/seed.sql with psql. It
# stays manual because staging is shared and seeding replaces the demo dataset:
# that is a decision somebody makes before a demo, not a side effect of a merge.
#
# Runbook, including the secrets this needs: docs/backend/seeding-staging.md
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Type the staging project ref to confirm the target (Supabase → Settings → General → Reference ID)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed:
    name: Seed staging demo data
    runs-on: ubuntu-latest
    environment: staging
    # Staging has one database. Share the migration deploy's queue so a seed
    # never runs while a `db push` is half-applied.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Two independent checks, both before anything is written. The typed ref
      # proves intent; the URL check proves the intent matches the target.
      # Production has its own project, its own secrets and its own deploy
      # workflow (#77, #78) — it must never be reachable from here.
      - name: Confirm the target is staging
        env:
          TYPED_REF: ${{ inputs.project_ref }}
          # A variable of the staging Environment after #110; the secret until then.
          STAGING_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$STAGING_REF" ] || fail "SUPABASE_PROJECT_REF is not set (staging Environment variable, or the old repository secret)."
          [ -n "$DB_URL" ] || fail "Secret STAGING_DB_URL is not set — see docs/backend/seeding-staging.md."
          # The repo is public: the demo password comes from a secret, never from
          # seed.sql (security pass 2026-09-27, H3). seed.sql refuses too.
          [ -n "$SEED_PASSWORD" ] || fail "Secret SEED_PASSWORD is not set (staging Environment) — see docs/backend/seeding-staging.md."
          [ "${#SEED_PASSWORD}" -ge 16 ] || fail "Secret SEED_PASSWORD is shorter than 16 characters."
          # bcrypt reads at most 72 bytes; seed.sql refuses a longer one too.
          [ "$(printf '%s' "$SEED_PASSWORD" | wc -c)" -le 72 ] || fail "Secret SEED_PASSWORD is longer than 72 bytes."

          [ "$TYPED_REF" = "$STAGING_REF" ] || \
            fail "The ref you typed is not the staging project ref. Nothing was touched."

          case "$DB_URL" in
            *"$STAGING_REF"*) ;;
            *) fail "STAGING_DB_URL does not point at the staging project. Nothing was touched." ;;
          esac

          echo "Target confirmed: staging."

      - name: Preflight
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

          # Fail here, with a sentence, rather than halfway through the seed.
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.roles') is null then
              raise exception
                'Migrations are not applied on this project: public.roles does not exist. Merge to main and let the deploy finish first.';
            end if;
            if (select count(*) from public.roles) <> 7 then
              raise exception
                'Migrations are only partly applied (public.roles has % rows, expected 7).',
                (select count(*) from public.roles);
            end if;
            if not has_table_privilege('auth.users', 'insert') then
              raise exception
                'This database role cannot write auth.users, so the demo logins would fail. Connect as postgres.';
            end if;
            raise notice 'Preflight OK.';
          end $$;
          SQL

      # --single-transaction: the seed clears the previous demo cohort before
      # inserting the new one, so a failure halfway must leave staging with the
      # old data rather than with half of the new.
      # The password reaches the seed as app.seed_password, set for this
      # transaction only (set_config(..., true)), so it is never stored in a
      # database setting. The select prints only 't', never the value.
      - name: Apply supabase/seed.sql
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -v seed_password="$SEED_PASSWORD" \
            --single-transaction -f - <<'SQL'
          select set_config('app.seed_password', :'seed_password', true) is not null as seed_password_set;
          \i supabase/seed.sql
          SQL

      # What landed, in the log, so a green tick is not the only evidence.
      - name: Show what landed
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- #936 dropped the leaderboard view; the same per-Member totals from the ledger.
          select rank() over (order by coalesce(sum(l.delta), 0) desc) as rank,
                 p.full_name, p.role, coalesce(sum(l.delta), 0) as points
            from profiles p left join points_ledger l on l.member_id = p.id
           where p.status = 'activ'
           group by p.id, p.full_name, p.role
           order by rank, p.full_name;

          select 'demo members' as what, count(*) from profiles where email like '%@demo.osubb'
          union all select 'tasks', count(*) from tasks
          union all select 'graded tasks', count(*) from tasks where rating is not null
          union all select 'ledger rows', count(*) from points_ledger
          union all select 'events', count(*) from events
          union all select 'announcements', count(*) from announcements
          union all select 'notifications', count(*) from notifications;
          SQL
